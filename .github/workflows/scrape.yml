name: Scrape Recalls

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: read
  actions: write # to keep this schedule switched on (see the last step)

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          
      # If you don't use .python-version, you can specify explicit version:
      #  python-version: "3.10" 

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: PYTHONPATH=. uv run pytest -q

      - name: Run Scraper
        env:
          # Optional. With it, Claude checks and translates each new recall once (src/classify.py).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: PYTHONPATH=. uv run python -u src/main.py
        
      - name: Save JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: |
            data/processed.json
            data/excluded.json
            data/status.json
          
      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          SCRAPED_DATE=$(date -u +"%Y-%m-%d")
          aws s3 cp \
            data/processed.json \
            s3://${{ vars.R2_BUCKET_NAME }}/baby/scraped_date=$SCRAPED_DATE/processed.json \
            --endpoint-url https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          aws s3 cp \
            data/processed.json \
            s3://${{ vars.R2_BUCKET_NAME }}/baby/scraped_date=latest/processed.json \
            --endpoint-url https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          for f in excluded.json status.json; do
            aws s3 cp \
              data/$f \
              s3://${{ vars.R2_BUCKET_NAME }}/baby/scraped_date=latest/$f \
              --endpoint-url https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          done

      # The same files in the bucket behind https://recalls-api.allo.land (Cloudflare account that holds allo.land).
      # Skipped until the R2_ALLO_* settings exist. The step above keeps the old r2.dev bucket current for readers
      # that haven't moved yet.
      - name: Upload to the allo.land R2 bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ALLO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ALLO_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BUCKET: ${{ vars.R2_ALLO_BUCKET_NAME || 'recall-tracker-data' }}
          # The account ID may be saved as a variable or as a secret.
          ACCOUNT_ID: ${{ vars.R2_ALLO_ACCOUNT_ID || secrets.R2_ALLO_ACCOUNT_ID }}
        run: |
          if [ -z "$ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::R2_ALLO_ACCOUNT_ID or R2_ALLO_ACCESS_KEY_ID is not set; skipping the allo.land bucket."
            exit 0
          fi
          ENDPOINT="https://$ACCOUNT_ID.r2.cloudflarestorage.com"
          SCRAPED_DATE=$(date -u +"%Y-%m-%d")
          aws s3 cp data/processed.json "s3://$BUCKET/baby/scraped_date=$SCRAPED_DATE/processed.json" --endpoint-url "$ENDPOINT"
          for f in processed.json excluded.json status.json; do
            aws s3 cp "data/$f" "s3://$BUCKET/baby/scraped_date=latest/$f" --endpoint-url "$ENDPOINT"
          done

      # GitHub switches off scheduled workflows after 60 days without commits (this happened in June 2026).
      # Re-enabling it on every run resets that timer, so the daily scrape keeps going.
      - name: Keep the daily schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scrape.yml/enable"

      - name: Fail if a source could not be scraped
        run: |
          if [ -s data/errors.txt ]; then
            echo "::error::Some sources failed (their recalls are missing from today's file):"
            cat data/errors.txt
            exit 1
          fi

